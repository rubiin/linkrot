version: 2

project_name: linkrot

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/linkrot
    # main.go declares `version`; release builds override it here.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

aurs:
  - name: linkrot-bin
    homepage: https://github.com/rubiin/linkrot
    description: Fast CLI link checker for local files
    license: GPL-3.0-only
    maintainers:
      - "rubiin <roobin.bhandari@gmail.com>"
    git_url: ssh://aur@aur.archlinux.org/linkrot-bin.git
    private_key: "{{ .Env.AUR_KEY }}"
    provides:
      - linkrot
    conflicts:
      - linkrot
    package: |-
      # bin
      install -Dm755 "./linkrot" "${pkgdir}/usr/bin/linkrot"
      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/linkrot/LICENSE"
      # completions (generated at package time from the shipped binary)
      ./linkrot completion bash > linkrot.bash
      ./linkrot completion zsh > _linkrot
      ./linkrot completion fish > linkrot.fish
      install -Dm644 "linkrot.bash" "${pkgdir}/usr/share/bash-completion/completions/linkrot"
      install -Dm644 "_linkrot" "${pkgdir}/usr/share/zsh/site-functions/_linkrot"
      install -Dm644 "linkrot.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/linkrot.fish"


nfpms:
  - package_name: linklint
    file_name_template: '{{ .ConventionalFileName }}'
    homepage: https://github.com/rubiin/linklint
    description: Fast CLI link checker for local files
    license: GPL-3.0-only
    maintainer: "rubiin <roobin.bhandari@gmail.com>"
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/linklint/LICENSE

changelog:
  sort: desc
  use: git

  groups:
    - title: 🚀 New Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?(fix|bug)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999


release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
